language: php

services:
  - mysql

php:
  - 8.2
  - 8.3

env:
  - APP_ENV=test

install:
  - composer install
  - npm install -g bower polymer-cli@"^1.6.0"
  - cd src/Rotalia/FrontendBundle/Resources/source/
  - bower install
  - polymer build
  - cd $TRAVIS_BUILD_DIR
  # Doctrine: no migrations exist yet on this branch, so the schema is created straight from
  # the entity mappings. Switch to `doctrine:migrations:migrate` once migrations/ is populated.
  - php bin/console doctrine:database:create --env=test
  - php bin/console doctrine:schema:create --env=test

script:
  - vendor/bin/phpunit
