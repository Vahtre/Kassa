<link rel="import" href="../bower_components/polymer/polymer.html">
<link rel="import" href="../bower_components/iron-ajax/iron-ajax.html">

<link rel="import" href="kassa-behavior.html">

<dom-module id="kassa-backend">
    <template>
        <!-- Authentication -->
        <iron-ajax id="authenticationDelete" handle-as="json" url='[[_computeURL("authentication")]]' method="DELETE"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="authenticationGet" handle-as="json" url='[[_computeURL("authentication")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="authenticationPost" handle-as="json" url='[[_computeURL("authentication")]]' method="POST"
                   content-type="application/json"></iron-ajax>
        <!-- Settings -->
        <iron-ajax id="settingsGet" handle-as="json" url='[[_computeURL("settings")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Members -->
        <iron-ajax id="membersGet" handle-as="json" url='[[_computeURL("members")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Products -->
        <iron-ajax id="productsGet" handle-as="json" url='[[_computeURL("products")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="productsPost" handle-as="json" url='[[_computeURL("products")]]' method="POST"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="productsPatch" handle-as="json" url='[[_computeURL("products", _id)]]' method="PATCH"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- ProductGroups -->
        <iron-ajax id="productGroupsGet" handle-as="json" url='[[_computeURL("productGroups")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="productGroupsPost" handle-as="json" url='[[_computeURL("productGroups")]]' method="POST"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="productGroupsPatch" handle-as="json" url='[[_computeURL("productGroups", _id)]]' method="PATCH"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- PointOfSales -->
        <iron-ajax id="pointOfSalesGet" handle-as="json" url='[[_computeURL("pointOfSales")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="pointOfSalesPost" handle-as="json" url='[[_computeURL("pointOfSales")]]' method="POST"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="pointOfSalesPatch" handle-as="json" url='[[_computeURL("pointOfSales", _id)]]' method="PATCH"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="pointOfSalesDelete" handle-as="json" url='[[_computeURL("pointOfSales", _id)]]' method="DELETE"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Purchase -->
        <iron-ajax id="purchasesGet" handle-as="json" url='[[_computeURL("purchase")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="purchasePost" handle-as="json" url='[[_computeURL("purchase", "credit")]]' method="POST"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Report -->
        <iron-ajax id="reportGet" handle-as="json" url='[[_computeURL("reports", _id)]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="reportsPost" handle-as="json" url='[[_computeURL("reports")]]' method="POST"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Transfers -->
        <iron-ajax id="transfersGet" handle-as="json" url='[[_computeURL("transfers")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="transfersPost" handle-as="json" url='[[_computeURL("transfers")]]' method="POST"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Credit Nettings -->
        <iron-ajax id="creditNettingsGet" handle-as="json" url='[[_computeURL("creditNettings")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="creditNettingsPatch" handle-as="json" url='[[_computeURL("creditNettings", _id)]]' method="PATCH"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Status credit limit -->
        <iron-ajax id="statusCreditLimitsGet" handle-as="json" url='[[_computeURL("statusCreditLimits")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <iron-ajax id="statusCreditLimitsPatch" handle-as="json" url='[[_computeURL("statusCreditLimits", _id)]]' method="PATCH"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
        <!-- Economy report -->
        <iron-ajax id="economyReportGet" handle-as="json" url='[[_computeURL("economyReport")]]' method="GET"
                   content-type="application/x-www-form-urlencoded"></iron-ajax>
    </template>
    <script>
        Polymer({
            is: 'kassa-backend',
            properties: {
                _id: {
                    type: Number
                },
                /* Authentication */
                member: {
                    type: Object,
                    notify: true,
                    readOnly: true
                },
                pointOfSaleId: {
                    type: String,
                    notify: true,
                    readOnly: true
                },
                /* Members */
                members: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* Settings */
                settings: {
                    type: Object,
                    notify: true,
                    readOnly: true
                },
                /* Products */
                products: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* ProductGroups */
                productGroups: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* PointOfSales */
                pointOfSales: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* Reports */
                singleReport: {
                    type: Object,
                    notify: true,
                    readOnly: true
                },
                updates: {
                    type: Object,
                    notify: true,
                    readOnly: true
                },
                reports: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* Transactions */
                transfers: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* CreditNettings */
                creditNettings: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* Purchases */
                purchases: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* Status credit limits */
                creditLimits: {
                    type: Array,
                    notify: true,
                    readOnly: true
                },
                /* Economy report */
                economyReport: {
                    type: Array,
                    notify: true,
                    readOnly: true
                }
            },
            listeners: {
                'error': '_checkError'
            },
            behaviors: [KassaBehavior],
            /* Authentication */
            doLogin: function (username, password, rememberMe) {
                this.$.authenticationPost.set('body', this._formatBody({
                    username: username,
                    password: password,
                    rememberMe: rememberMe,
                }));
                return this.$.authenticationPost.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.fire('kassa-message-success', response.data);
                    return this.doAuthenticationGet();
                }.bind(this));
            },
            doLogout: function () {
                return this.$.authenticationDelete.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.fire('kassa-message-success', response.data);
                    this._setMember(null);
                    this._setSettings(null);
                }.bind(this));
            },
            doAuthenticationGet: function () {
                return this.$.authenticationGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setMember(response.data.member);
                    if (response.data.member) {
                        this.doSettingsGet();
                    }
                    this._setPointOfSaleId(response.data.pointOfSaleId);

                    return response.headers;
                }.bind(this));
            },
            /* Settings */
            doSettingsGet: function () {
                return this.$.settingsGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setSettings(response.data);

                    return response
                }.bind(this));
            },
            /* Members */
            doMembersGet: function (conventId, isActive) {
                this.$.membersGet.set('params', this._formatBody({
                    conventId: conventId,
                    isActive: isActive,
                    limit: 0
                }));
                return this.$.membersGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setMembers(response.data.members);

                    return response.headers;
                }.bind(this));
            },
            /* Products */
            doProductsGet: function (conventId, isActive, resourceType) {
                this.$.productsGet.set('params', this._formatBody({
                    conventId: conventId,
                    active: isActive,
                    resourceType: resourceType
                }));
                return this.$.productsGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setProducts(response.data.products);

                    return response.headers;
                }.bind(this));
            },
            doProductsPost: function (conventId, productType) {
                this.$.productsPost.set('body', this._formatBody({
                    conventId: conventId,
                    product: productType,
                }));
                return this.$.productsPost.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.push('products', response.data.product);
                    this.fire('kassa-message-success', 'Toode edukalt lisatud');
                }.bind(this));
            },
            doProductsPatch: function (conventId, productId, productType) {
                this.$.productsPatch.set('body', this._formatBody({
                    conventId: conventId,
                    product: productType
                }));
                this.set('_id', productId);
                return this.$.productsPatch.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    if (this._updateItems('products', this.products, response.data.product)) {
                        this.fire('kassa-message-success', 'Toode edukalt muudetud');
                    }
                }.bind(this));
            },
            /* ProductGroups */
            doProductGroupsGet: function () {
                return this.$.productGroupsGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setProductGroups(response.data.productGroups);

                    return response.headers;
                }.bind(this));
            },
            doProductGroupsPost: function (productGroup) {
                this.$.productGroupsPost.set('body', this._formatBody({
                    productGroup: productGroup
                }));
                return this.$.productGroupsPost.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.push('productGroups', response.data.productGroup);
                    this.fire('kassa-message-success', 'Tootegrupp edukalt lisatud');
                }.bind(this));
            },
            doProductGroupsPatch: function (productGroupId, productGroup) {
                this.$.productGroupsPatch.set('body', this._formatBody({
                    productGroup: productGroup
                }));
                this.set('_id', productGroupId);
                return this.$.productGroupsPatch.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._updateItems('productGroups', this.productGroups, response.data.productGroup);
                    this.fire('kassa-message-success', 'Tootegrupp edukalt muudetud');
                }.bind(this));
            },
            /* PointOfSales */
            doPointOfSalesGet: function () {
                return this.$.pointOfSalesGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setPointOfSales(response.data.pointOfSales);

                    return response.headers;
                }.bind(this));
            },
            doPointOfSalesPost: function (conventId, pointOfSaleType) {
                this.$.pointOfSalesPost.set('body', this._formatBody({
                    conventId: conventId,
                    pointOfSale: pointOfSaleType
                }));
                return this.$.pointOfSalesPost.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.push('pointOfSales', response.data.pointOfSale);
                    this.fire('kassa-message-success', 'Müügipunkt edukalt lisatud');
                }.bind(this));
            },
            doPointOfSalesPatch: function (pointOfSaleId, pointOfSaleType) {
                this.$.pointOfSalesPatch.set('body', this._formatBody({
                    pointOfSale: pointOfSaleType
                }));
                this.set('_id', pointOfSaleId);
                return this.$.pointOfSalesPatch.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._updateItems('pointOfSales', this.pointOfSales, response.data.pointOfSale);
                    this.fire('kassa-message-success', 'Müügipunkt edukalt muudetud');
                }.bind(this));
            },
            doPointOfSalesDelete: function (pointOfSaleId) {
                this.set('_id', pointOfSaleId);
                return this.$.pointOfSalesDelete.generateRequest().completes.then(this._checkSuccess).then(function () {
                    this._deleteItems('pointOfSales', this.pointOfSales, pointOfSaleId);
                    this.fire('kassa-message-success', 'Müügipunkt edukalt kustutatud');
                }.bind(this));
            },
            /* Purchase */
            doPurchasesGet: function (conventId, memberId, memberName, createdByName, dateFrom, dateUntil, limit, offset) {
                this.$.purchasesGet.set('params', this._formatBody({
                    conventId: conventId,
                    memberId: memberId,
                    memberName: memberName,
                    createdByName: createdByName,
                    dateFrom: dateFrom,
                    dateUntil: dateUntil,
                    limit: limit,
                    offset: offset
                }));
                return this.$.purchasesGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setPurchases(response.data.purchases);

                    return response.headers;
                }.bind(this));
            },
            doPurchasePost: function (conventId, memberId, basket) {
                this.$.purchasePost.set('body', this._formatBody({
                    conventId: conventId,
                    memberId: memberId,
                    basket: basket
                }));
                return this.$.purchasePost.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.fire('kassa-message-success', 'Ost edukalt sooritatud');
                    if (memberId === this.member.id) {
                        this.set('member.creditBalance', response.data.newCredit);
                    }
                }.bind(this));
            },
            /* Reports */
            doSingleReportGet: function (conventId, reportId, target, reportType) {
                this.set('_id', reportId);
                this.$.reportGet.set('params', this._formatBody({
                    conventId: conventId,
                    target: target,
                    reportType: reportType
                }));
                return this.$.reportGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setSingleReport(response.data.report);
                    this._setUpdates(response.data.updates);

                    return response.headers;
                }.bind(this));
            },
            doReportsGet: function (conventId, target, reportType, memberName,  dateFrom, dateUntil, limit, offset) {
                this.set('_id', null);
                this.$.reportGet.set('params', this._formatBody({
                    conventId: conventId,
                    target: target,
                    reportType: reportType,
                    memberName: memberName,
                    dateFrom: dateFrom,
                    dateUntil: dateUntil,
                    limit: limit,
                    offset: offset
                }));
                return this.$.reportGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setReports(response.data.reports);

                    return response.headers;
                }.bind(this));
            },
            doReportPost: function(conventId, Report, cashOut){
                this.$.reportsPost.set('body', this._formatBody({
                    conventId: conventId,
                    type: 'VERIFICATION',
                    Report: Report,
                    cashOut: cashOut
                }));
                return this.$.reportsPost.generateRequest().completes.then(this._checkSuccess).then(function () {
                    this.fire('kassa-message-success', 'Aruanne edukalt lisatud');
                }.bind(this));
            },
            doDeliveryPost: function(conventId, itemType) {
                this.$.reportsPost.set('body', this._formatBody({
                    conventId: conventId,
                    type: 'UPDATE',
                    Report: itemType
                }));
                return this.$.reportsPost.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.unshift('reports', response.data.report);
                    this.fire('kassa-message-success', 'Tarne edukalt lisatud');
                }.bind(this));
            },
            /* Transfers */
            doTransfersGet: function (conventId, memberId, memberName, dateFrom, dateUntil, limit, offset) {
                this.$.transfersGet.set('params', this._formatBody({
                    conventId: conventId,
                    memberId: memberId,
                    memberName: memberName,
                    dateFrom: dateFrom,
                    dateUntil: dateUntil,
                    limit: limit,
                    offset: offset
                }));
                return this.$.transfersGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setTransfers(response.data.transfers);

                    return response.headers;
                }.bind(this));
            },
            doTransfersPost: function (conventId, transferType) {
                this.$.transfersPost.set('body', this._formatBody({
                    conventId: conventId,
                    transfer: transferType
                }));
                return this.$.transfersPost.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this.unshift('transfers', response.data.transfer);
                    this.fire('kassa-message-success', 'Ülekanne edukalt lisatud');
                    return this.doAuthenticationGet();
                }.bind(this));
            },
            /* CreditNettings */
            doCreditNettingsGet: function () {
                return this.$.creditNettingsGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setCreditNettings(response.data.creditNettings);

                    return response.headers;
                }.bind(this));
            },
            doCreditNettingsPatch: function (conventId, creditNettingId, CreditNettingRowType) {
                this.$.creditNettingsPatch.set('body', this._formatBody({
                    CreditNettingRowType: CreditNettingRowType,
                    conventId: conventId
                }));
                this.set('_id', creditNettingId);
                return this.$.creditNettingsPatch.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._updateItems('creditNettings', this.creditNettings, response.data.creditNetting);
                    this.fire('kassa-message-success', 'Tasaarveldus edukalt muudetud');
                }.bind(this));
            },
            /* Status credit limits */
            doCreditLimitsGet: function () {
                return this.$.statusCreditLimitsGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setCreditLimits(response.data.creditLimits);

                    return response.headers;
                }.bind(this));
            },
            doCreditLimitsPatch: function (creditLimits) {
                return Promise.all(creditLimits.map(function (creditLimit) {
                    this.set('_id', creditLimit['statusId']);
                    this.$.statusCreditLimitsPatch.set('body', this._formatBody({
                        creditLimit: creditLimit['creditLimit']
                    }));
                    return this.$.statusCreditLimitsPatch.generateRequest().completes.then(this._checkSuccess);
                }.bind(this))).then(function () {
                    this.fire('kassa-message-success', 'Krediidi limiidid edukalt määratud');
                }.bind(this));
            },
            /* Economy report */
            doEconomyReportGet: function(conventId, dateFrom, dateUntil) {
                this.$.economyReportGet.set('params', this._formatBody({
                    conventId: conventId,
                    dateFrom: dateFrom,
                    dateUntil: dateUntil
                }));
                return this.$.economyReportGet.generateRequest().completes.then(this._checkSuccess).then(function (response) {
                    this._setEconomyReport(response.data);
                }.bind(this));
            },
            /* General */
            doAction: function (data) {
                let promise;
                switch (data.action) {
                    /* Authentication */
                    case 'doLogin':
                        promise = this.doLogin(data.username, data.password, data.rememberMe);
                        break;
                    case 'doLogout':
                        promise = this.doLogout();
                        break;
                    case 'doAuthenticationGet':
                        promise = this.doAuthenticationGet();
                        break;
                    /* Members */
                    case 'doMembersGet':
                        promise = this.doMembersGet(data.conventId, data.isActive);
                        break;
                    /* Products */
                    case 'doProductsGet':
                        promise = this.doProductsGet(data.conventId, data.isActive, data.resourceType);
                        break;
                    case 'doProductsPost':
                        promise = this.doProductsPost(data.conventId, data.itemType);
                        break;
                    case 'doProductsPatch':
                        promise = this.doProductsPatch(data.conventId, data.id, data.itemType);
                        break;
                    /* ProductGroups */
                    case 'doProductGroupsGet':
                        promise = this.doProductGroupsGet();
                        break;
                    case 'doProductGroupsPost':
                        promise = this.doProductGroupsPost(data.itemType);
                        break;
                    case 'doProductGroupsPatch':
                        promise = this.doProductGroupsPatch(data.id, data.itemType);
                        break;
                    /* PointOfSales */
                    case 'doPointOfSalesGet':
                        promise = this.doPointOfSalesGet();
                        break;
                    case 'doPointOfSalesPost':
                        promise = this.doPointOfSalesPost(data.conventId, data.itemType);
                        break;
                    case 'doPointOfSalesPatch':
                        promise = this.doPointOfSalesPatch(data.id, data.itemType);
                        break;
                    case 'doPointOfSalesDelete':
                        promise = this.doPointOfSalesDelete(data.id);
                        break;
                    /* Purchases */
                    case 'doPurchasesGet':
                        promise = this.doPurchasesGet(data.conventId, data.memberId, data.memberName, data.createdByName,
                            data.dateFrom, data.dateUntil, data.limit, data.offset);
                        break;
                    case 'doPurchasePost':
                        promise = this.doPurchasePost(data.conventId, data.memberId, data.basket);
                        break;
                    /* Reports */
                    case 'doSingleReportGet':
                        promise = this.doSingleReportGet(data.conventId, data.id, data.target, data.reportType);
                        break;
                    case 'doReportsGet':
                        promise = this.doReportsGet(data.conventId, data.target, data.reportType, data.memberName,
                            data.dateFrom, data.dateUntil, data.limit, data.offset);
                        break;
                    case 'doReportPost':
                        promise = this.doReportPost(data.conventId, data.Report, data.cashOut);
                        break;
                    case 'doDeliveryPost':
                        promise = this.doDeliveryPost(data.conventId, data.itemType);
                        break;
                    /* Transfers */
                    case 'doTransfersGet':
                        promise = this.doTransfersGet(data.conventId, data.memberId, data.memberName,
                            data.dateFrom, data.dateUntil, data.limit, data.offset);
                        break;
                    case 'doTransfersPost':
                        promise = this.doTransfersPost(data.conventId, data.itemType);
                        break;
                    /* CreditNettings*/
                    case 'doCreditNettingsGet':
                        promise = this.doCreditNettingsGet();
                        break;
                    case 'doCreditNettingsPatch':
                        promise = this.doCreditNettingsPatch(data.conventId, data.creditNettingId, data.creditNettingRowType);
                        break;
                    /* Status credit limits*/
                    case 'doCreditLimitsGet':
                        promise = this.doCreditLimitsGet();
                        break;
                    case 'doCreditLimitsPatch':
                        promise = this.doCreditLimitsPatch(data.creditLimits);
                        break;
                    /* Economy report */
                    case 'doEconomyReportGet':
                        promise = this.doEconomyReportGet(data.conventId, data.dateFrom, data.dateUntil);
                        break;
                    /* General */
                    default:
                        console.error('Vale action.', data);
                        return null;
                }

                promise.then(function (headers) {
                    if (data.onSuccess) {
                        data.onSuccess(headers);
                    }
                }).catch(function (error) {
                    if (data.onError) {
                        data.onError();
                    } else {
                        // On else sees, kuna ei taha uuesti proovida kõiki päringuid. Näiteks POST purcache.
                        if (typeof error === 'object') {
                            this.async(function () {
                                this.doAction(data);
                            }.bind(this), 500);
                        }
                    }
                    console.error(error);
                }.bind(this));
            },
            _computeURL: function (endpoint, id) {
                if (id === undefined || id === null) {
                    return '/api/' + endpoint;
                } else {
                    return '/api/' + endpoint + '/' + id;
                }
            },
            _checkSuccess: function (result) {
                if (result.xhr.response && result.xhr.response.status === 'success') {
                    return {
                        data: result.xhr.response.data,
                        headers: {
                            'Content-Range': result.xhr.getResponseHeader('Content-Range')
                        }
                    };
                } else {
                    this.fire('kassa-message-error', {message: 'Vigane vastus serverilt'});
                    throw 'Vigane vastus serverilt';
                }
            },
            _checkError: function (event) {
                event.stopPropagation();

                let response;
                if (event.detail.request.xhr.response) {
                    if (event.detail.request.xhr.response.status === 'fail' || event.detail.request.xhr.response.status === 'error') {
                        response = event.detail.request.xhr.response;
                    } else {
                        response = {message: 'Vigane vastus serverilt'};
                    }
                } else {
                    response = {message: 'Ei saanud vastust serverilt'};
                }
                this.fire('kassa-message-error', {message: response.message, data: response.data});
            },
            _formatBody: function (body, inner) {
                if (inner === undefined) {
                    inner = false;
                }

                const newBody = {};
                for (let key in body) {
                    if (body.hasOwnProperty(key)) {

                        if (body[key] === null || body[key] === undefined || body[key] === '') {
                            continue;
                        }

                        if (body[key].constructor === Object) {
                            let innerBody = this._formatBody(body[key], true);
                            for (let innerKey in innerBody) {
                                if (innerBody.hasOwnProperty(innerKey)) {
                                    if (inner) {
                                        newBody['[' + key + ']' + innerKey] = innerBody[innerKey];
                                    } else {
                                        newBody[key + innerKey] = innerBody[innerKey];
                                    }

                                }
                            }

                        } else if (Array.isArray(body[key])) {
                            for (let i = 0; i < body[key].length; i++) {
                                let innerBody = this._formatBody(body[key][i], true);
                                for (let innerKey in innerBody) {
                                    if (innerBody.hasOwnProperty(innerKey)) {
                                        if (inner) {
                                            newBody['[' + key + ']' + '[' + i + ']' + innerKey] = innerBody[innerKey];
                                        } else {
                                            newBody[key + '[' + i + ']' + innerKey] = innerBody[innerKey];
                                        }

                                    }
                                }
                            }

                        } else {
                            if (inner) {
                                newBody['[' + key + ']'] = body[key];
                            } else {
                                newBody[key] = body[key];
                            }
                        }
                    }
                }
                return newBody
            },
            _updateItems: function (itemsPath, items, newItem) {
                for (let i = 0; i < items.length; i++) {
                    if (items[i]['id'] === newItem['id']) {
                        this.set(itemsPath + '.' + i, newItem);
                        return true
                    }
                }
                return false
            },
            _deleteItems: function (itemsPath, items, id) {
                for (let i = 0; i < items.length; i++) {
                    if (items[i]['id'] === id) {
                        this.splice(itemsPath, i, 1);
                        return true
                    }
                }
                return false
            }
        })

    </script>
</dom-module>
